name: Test

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
  pull_request:
    types: [ opened, synchronize, reopened ]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Get project dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      # The excluded packages drive a real panel API (they expect a mock server
      # on localhost:8080 / 127.0.0.1:668) or hit the network for ACME, so they
      # cannot run here. Everything else is hermetic and must stay green.
      - name: Test
        run: |
          PKGS=$(go list ./... | grep -vE '/(api/(bunpanel|gov2panel|newV2board|pmpanel|proxypanel|sspanel|v2raysocks)|common/mylego)$')
          go test $PKGS -count=1
